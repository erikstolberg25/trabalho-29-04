<!DOCTYPE html>
<html lang="pt/BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
function enviar() {
    let nome = document.getElementById('nome').value;
    let data = new Date();
    let hora = data.getHours();  // horario atual segundo ao "date"
    let minutos = data.getMinutes();
    let saudacao = "";
     if (hora < 12) 
     {
     saudacao = "Bom dia";
       }
        else if (hora < 18){
            saudacao = "Boa tarde";
     } 
        else {
         saudacao = "Boa noite";
         }
         let mensagem = `${saudacao}, ${nome}! Agora são ${hora}:${minutos < 10 ? '0' + minutos : minutos}.`;        // string interpolada, que vai mostra uma mensagem ao usuario!
            document.getElementById('mensagem').innerText = mensagem;
        }

    </script>
</head>
<body>
    <h1>Saudações com Horario</h1>
    <p>Digite seu nome!</p>
    <input type="text" id="nome">
    <button onclick="enviar()">Enviar</button>
    <div id="mensagem"></div>

</body>
</html>
