<!DOCTYPE html>
<html lang="pt/BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAREFA1</title>
<script>
let contador= 0;
function processar() {
contador++;
document.getElementById("resultado").innerHTML = "Cliques Malucos: " + contador;
}
function resetar() {
contador = 0;
document.getElementById("resultado").innerHTML = "Cliques Malucos: " + contador;
}
</script>
</head>
<body>
<h1>MÁQUINA DE CLICAR</h1>
<p>aperte o botão</p>
<button onclick="processar()">clique aqui</button>
<button onclick="resetar()">Zerar Tudo</button>
<div id="resultado">Cliques Malucos: 0</div>
</body>
</html>
